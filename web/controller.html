<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1119"><title>NONA Controller</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/controller.css"><script defer src="/static/controller.js"></script></head>
<body class="controller-body"><main class="pad-shell"><header><span class="brand"><span class="brand-icon">✚</span> NONA</span><span class="pill" id="connection"><span class="dot"></span><span id="status">Connecting…</span></span></header><div class="pad-meta"><span class="eyebrow">Player 01 / Touch controller</span><span id="latency" class="tiny">RTT —</span></div><div class="controller-mode"><label for="controller-profile">Controls</label><select id="controller-profile"><option value="arrows">Gamepad · Arrows</option><option value="wasd">Gamepad · WASD</option><option value="racing_arrows">Racing · Arrows</option><option value="racing_wasd">Racing · WASD</option></select><span id="bridge-status" class="tiny">Desktop keys off</span></div><p id="message" class="pad-message">Keep this page open while playing on your laptop.</p><section id="gamepad-controls" class="pad-controls" aria-label="Game controller"><div class="dpad" aria-label="Directional pad"><button data-button="up" class="pad-key up" aria-label="Up">↑</button><button data-button="left" class="pad-key left" aria-label="Left">←</button><span class="pad-centre">✚</span><button data-button="right" class="pad-key right" aria-label="Right">→</button><button data-button="down" class="pad-key down" aria-label="Down">↓</button></div><div class="action-pad"><button data-button="b" class="action-key b">B<span>Brake / X</span></button><button data-button="a" class="action-key a">A<span>Boost / Space</span></button></div></section><section id="racing-controls" class="racing-controls hidden" aria-label="Racing controller"><div class="wheel-area"><div id="wheel" class="wheel" role="slider" tabindex="0" aria-label="Steering wheel" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"><div id="wheel-face" class="wheel-face"><span class="wheel-marker"></span><span class="wheel-spoke spoke-left"></span><span class="wheel-spoke spoke-right"></span><span class="wheel-spoke spoke-down"></span><span class="wheel-hub">N</span></div></div><span class="tiny">Drag left / right · Release to centre</span></div><div class="pedal-area"><button data-button="b" class="pedal brake">BRAKE<span>Slow down</span></button><button data-button="a" class="pedal gas">GAS<span>Hold to accelerate</span></button></div><div class="race-extras"><button data-button="handbrake" class="race-extra">Handbrake</button><button data-button="nitro" class="race-extra nitro">Nitro</button></div></section><div class="utility"><button data-button="select" class="utility-key">Select<span id="select-hint">P / Reset demo</span></button><button data-button="start" class="utility-key">Start<span id="start-hint">Enter / Pause</span></button></div><div class="pad-bottom"><button id="fullscreen" class="secondary">Fullscreen</button><button id="reconnect" class="secondary">Reconnect</button><button id="release" class="danger">Release all</button></div><p class="tiny pad-help">Hold a pedal and steer together. Landscape gives you more room.<br>Touch wheel in this version · Tilt / motion is on the roadmap.</p></main></body></html>
