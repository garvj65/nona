name: NONA checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol-and-physics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Check optional Xbox adapter installation without its driver hook
        if: runner.os == 'Windows'
        env:
          VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
        run: python -m pip install -r requirements-gamepad.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/race.test.cjs tests/motion.test.cjs tests/mobile.test.cjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-screenshots
          path: artifacts/
          if-no-files-found: ignore
