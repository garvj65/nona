name: Android preview
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, lint and test APKs
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nona-android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: nona-android-instrumentation
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
  native-ui:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: nona-android-preview
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: nona-android-instrumentation
          path: test-apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p artifacts/android-ui
            adb install -r apk/app-debug.apk
            adb install -r test-apk/app-debug-androidTest.apk
            adb shell am instrument -w dev.nona.controller.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-instrumentation.log
            adb pull /sdcard/Android/data/dev.nona.controller/files/ui artifacts/android-ui
            python -c "from pathlib import Path; log=Path('artifacts/android-instrumentation.log').read_text(); assert 'OK (' in log and 'FAILURES!!!' not in log, log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-checks
          path: artifacts/
          if-no-files-found: ignore
